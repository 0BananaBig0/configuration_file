<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <match target="pattern">
    <test name="family" compare="contains">
      <string>FantasqueSansM</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Monospace</string>
    </edit>
  </match>
</fontconfig>
